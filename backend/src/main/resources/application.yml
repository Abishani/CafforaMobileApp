spring:
  application:
    name: caffora-backend

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:caffora}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:caffora}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false

  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:${SERVER_PORT:8080}}
  # Spring's fallback /error response (errors outside controllers). The API's own messages come
  # from GlobalExceptionHandler / SecurityConfig and are unaffected by these settings.
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

caffora:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24h
    issuer: caffora-backend
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  pricing:
    tax-rate: 0.08
    pickup-fee: 0.50
  admin:
    seed-email: ${ADMIN_SEED_EMAIL:admin@caffora.com}
    seed-password: ${ADMIN_SEED_PASSWORD}
    seed-name: ${ADMIN_SEED_NAME:System Admin}

# Only /actuator/health is exposed (used as the Railway health check); no details are shown.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    com.caffora.backend: DEBUG
